<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>customF1</title>
<style>
  /* ===== CSS: 색과 모양 ===== */
  :root {
    --bg: #f5f5f3; --card: #ffffff; --text: #1a1a1c; --muted: #6b6b70;
    --line: #e2e2de; --red: #e10600;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151517; --card: #1f1f22; --text: #f0f0f0; --muted: #9a9aa0; --line: #333338; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
  header { border-top: 6px solid var(--red); padding: 24px 20px 8px; max-width: 760px; margin: 0 auto;
           display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  h1 { margin: 0; font-size: 1.6rem; }
  #sub { color: var(--muted); margin: 4px 0 0; font-size: .9rem; }
  #refresh { border: 1px solid var(--line); background: var(--card); color: var(--muted);
             padding: 6px 10px; border-radius: 8px; cursor: pointer; font-size: .8rem; white-space: nowrap; }
  #refresh:disabled { opacity: .5; cursor: default; }
  nav { max-width: 760px; margin: 12px auto 0; padding: 0 20px; display: flex; gap: 8px; }
  nav button { border: 1px solid var(--line); background: var(--card); color: var(--text);
               padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: .95rem; }
  nav button.on { background: var(--red); color: #fff; border-color: var(--red); }
  button:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }
  main { max-width: 760px; margin: 12px auto 40px; padding: 0 20px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 10px 14px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { color: var(--muted); font-weight: 500; font-size: .85rem; }
  tr:last-child td { border-bottom: 0; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  td.pos { font-weight: 700; width: 3em; }
  tr:first-child td.pos { color: var(--red); }
  .next { padding: 24px; }
  .next .round { color: var(--muted); font-size: .9rem; }
  .next h2 { margin: 4px 0 12px; font-size: 1.5rem; }
  .next .when { font-size: 1.1rem; font-weight: 600; }
  .next .count { color: var(--red); font-weight: 700; font-size: 1.8rem; margin-top: 14px;
                 font-variant-numeric: tabular-nums; }
  .next .count.done { font-size: 1rem; }
  .msg { padding: 24px; color: var(--muted); }
  #updated { color: var(--muted); font-size: .8rem; margin: 8px 2px 0; }
  pre { padding: 16px; margin: 0; overflow: auto; font-size: .8rem; }
</style>
</head>
<body>
<header>
  <div>
    <h1>customF1</h1>
    <p id="sub">데이터를 불러오는 중...</p>
  </div>
  <button id="refresh" title="저장된 데이터를 무시하고 지금 새로 받아옵니다">지금 새로고침</button>
</header>
<nav id="tabs">
  <button data-tab="drivers" class="on">드라이버</button>
  <button data-tab="teams">팀</button>
  <button data-tab="next">다음 경기</button>
</nav>
<main>
  <div id="view" class="card"><div class="msg">불러오는 중...</div></div>
  <p id="updated"></p>
</main>

<script>
  // ===== JavaScript: 데이터를 가져와서 화면에 채우기 =====
  const BASE = "https://f1api.dev/api";

  // 각 탭이 쓰는 API 주소 (문서와 다르면 여기만 고치면 됩니다)
  const URLS = {
    drivers: BASE + "/current/drivers-championship",
    teams:   BASE + "/current/constructors-championship",
    next:    BASE + "/current/next",
  };
  const KEYS = Object.keys(URLS);

  const view = document.getElementById("view");
  const sub = document.getElementById("sub");
  const updated = document.getElementById("updated");
  const refreshBtn = document.getElementById("refresh");

  // ---------- 1) '가장 최근 월요일 오전 8시(한국 시간)' 계산 ----------
  // 한국은 UTC보다 9시간 빠르고 서머타임이 없어서 계산이 단순합니다.
  function lastMondayBoundary(now = Date.now()) {
    const KST = 9 * 3600 * 1000;
    const k = new Date(now + KST);                 // 한국 시각을 UTC 필드로 읽기 위한 트릭
    const sinceMonday = (k.getUTCDay() + 6) % 7;   // 월요일=0, 화요일=1 ... 일요일=6
    let t = Date.UTC(k.getUTCFullYear(), k.getUTCMonth(), k.getUTCDate() - sinceMonday, 8, 0, 0) - KST;
    if (t > now) t -= 7 * 24 * 3600 * 1000;       // 아직 이번 월요일 8시 전이면 지난주 월요일
    return t;
  }

  // ---------- 2) 저장하고 꺼내기 ----------
  const memory = {};    // 이번 접속 중에 쓸 데이터
  const pending = {};   // 지금 요청 중인 것

  // 저장된 데이터 꺼내기: { data: API 응답, at: 받은 시각 }
  function load(key) {
    if (memory[key]) return memory[key];
    try {
      const s = localStorage.getItem("f1v2:" + key);
      if (s) {
        const rec = JSON.parse(s);
        if (rec && rec.data && rec.at) { memory[key] = rec; return rec; }
      }
    } catch (e) {}
    return null;
  }

  function save(key, data) {
    const rec = { data: data, at: Date.now() };
    memory[key] = rec;
    try { localStorage.setItem("f1v2:" + key, JSON.stringify(rec)); } catch (e) {}
    return rec;
  }

  // 저장된 데이터가 없거나, 가장 최근 월요일 8시 이전에 받은 거라면 '오래된 데이터'
  function isStale(rec) { return !rec || rec.at < lastMondayBoundary(); }

  // API에서 새로 받아오기
  async function fetchFresh(key) {
    const res = await fetch(URLS[key]);
    if (!res.ok) throw new Error("HTTP " + res.status);
    return save(key, await res.json());
  }

  // 같은 요청을 동시에 두 번 보내지 않기
  function refresh(key) {
    if (!pending[key]) pending[key] = fetchFresh(key).finally(() => delete pending[key]);
    return pending[key];
  }

  // ---------- 3) 화면 그리기 ----------
  let current = "drivers";   // 지금 보고 있는 탭
  let timer = null;          // 카운트다운 타이머

  function stopTimer() { if (timer) { clearInterval(timer); timer = null; } }

  function showUpdated(rec) {
    const t = new Date(rec.at).toLocaleString("ko-KR", {
      timeZone: "Asia/Seoul", month: "long", day: "numeric", hour: "2-digit", minute: "2-digit"
    });
    updated.textContent = "데이터를 받은 시각: " + t + " (한국 시간)";
  }

  // 데이터 모양이 예상과 다를 때, 원본을 그대로 보여주기
  function showRaw(data, note) {
    view.innerHTML = '<div class="msg">' + note + '</div><pre></pre>';
    view.querySelector("pre").textContent = JSON.stringify(data, null, 2);
  }
  const SHAPE_MSG = "예상과 다른 데이터 모양입니다. 아래 원본을 보고 필드 이름을 맞춰주세요.";

  function renderDrivers(rec) {
    const data = rec.data, rows = data.drivers_championship;
    if (!Array.isArray(rows)) return showRaw(data, SHAPE_MSG);
    sub.textContent = data.season ? data.season + " 시즌 드라이버 순위" : "드라이버 순위";
    view.innerHTML = "<table><thead><tr><th>순위</th><th>드라이버</th><th>팀</th>" +
      '<th class="num">승</th><th class="num">점수</th></tr></thead><tbody>' +
      rows.map(r => {
        const d = r.driver || {};
        const name = ((d.name || "") + " " + (d.surname || "")).trim() || r.driverId;
        const team = (r.team && r.team.teamName) || r.teamId || "";
        return `<tr><td class="pos">${r.position}</td><td>${name}</td><td>${team}</td>` +
               `<td class="num">${r.wins ?? "-"}</td><td class="num">${r.points}</td></tr>`;
      }).join("") + "</tbody></table>";
  }

  function renderTeams(rec) {
    const data = rec.data, rows = data.constructors_championship;
    if (!Array.isArray(rows)) return showRaw(data, SHAPE_MSG);
    sub.textContent = data.season ? data.season + " 시즌 팀 순위" : "팀 순위";
    view.innerHTML = "<table><thead><tr><th>순위</th><th>팀</th>" +
      '<th class="num">승</th><th class="num">점수</th></tr></thead><tbody>' +
      rows.map(r => {
        const team = (r.team && r.team.teamName) || r.teamId || "";
        return `<tr><td class="pos">${r.position}</td><td>${team}</td>` +
               `<td class="num">${r.wins ?? "-"}</td><td class="num">${r.points}</td></tr>`;
      }).join("") + "</tbody></table>";
  }

  // 다음 경기: 시작 시각은 저장된 데이터로, 남은 시간은 '지금 접속한 시각' 기준으로 계산
  function renderNext(rec) {
    const data = rec.data;
    const race = Array.isArray(data.race) ? data.race[0] : null;
    const date = race && race.schedule && race.schedule.race && race.schedule.race.date;
    if (!race || !date) return showRaw(data, SHAPE_MSG);
    const time = race.schedule.race.time || "00:00:00Z";
    const start = new Date(date + "T" + time);   // 시간 끝의 Z는 UTC라는 뜻
    const kst = start.toLocaleString("ko-KR", {
      timeZone: "Asia/Seoul", year: "numeric", month: "long", day: "numeric",
      weekday: "long", hour: "2-digit", minute: "2-digit"
    });
    const c = race.circuit || {};
    sub.textContent = "다음 경기 일정";
    view.innerHTML = `<div class="next">
      <div class="round">${data.season || ""} 시즌 ${data.round || race.round || ""}라운드</div>
      <h2>${race.raceName || "다음 그랑프리"}</h2>
      <div>${[c.circuitName, c.city, c.country].filter(Boolean).join(", ")}</div>
      <div class="when">${isNaN(start) ? date : kst + " (한국 시간)"}</div>
      <div class="count" id="count"></div>
    </div>`;
    if (isNaN(start)) return;

    // 남은 시간을 일 / 시간 / 분으로 계산해서 1초마다 갱신
    function tick() {
      const el = document.getElementById("count");
      if (!el) return stopTimer();
      const ms = start - Date.now();
      if (ms <= 0) {
        el.className = "count done";
        el.textContent = "경기가 진행 중이거나 끝났습니다. 월요일 오전 8시 이후 접속하면 다음 경기로 바뀝니다.";
        return stopTimer();
      }
      const total = Math.floor(ms / 60000);   // 남은 전체 분
      el.textContent = Math.floor(total / 1440) + "일 " +
                       Math.floor((total % 1440) / 60) + "시간 " + (total % 60) + "분 남음";
    }
    tick();
    timer = setInterval(tick, 1000);
  }

  const renderers = { drivers: renderDrivers, teams: renderTeams, next: renderNext };

  function render(tab, rec) {
    stopTimer();
    renderers[tab](rec);
    showUpdated(rec);
  }

  // ---------- 4) 탭 보여주기 ----------
  async function show(tab) {
    current = tab;
    // 저장된 데이터가 있으면 즉시 보여주기
    const rec = load(tab);
    if (rec) render(tab, rec);
    else { stopTimer(); updated.textContent = ""; view.innerHTML = '<div class="msg">불러오는 중...</div>'; }

    // 이번 주 월요일 8시 이후에 받은 데이터라면 여기서 끝 (API 요청 없음)
    if (!isStale(rec)) return;

    // 아니라면 새로 받아서 교체
    try {
      const fresh = await refresh(tab);
      if (current === tab) render(tab, fresh);
    } catch (e) {
      if (!rec && current === tab) {
        view.innerHTML = '<div class="msg">데이터를 불러오지 못했습니다 (' + e.message +
          '). 인터넷 연결과 API 주소를 확인해 보세요.</div>';
      }
    }
  }

  document.getElementById("tabs").addEventListener("click", e => {
    const btn = e.target.closest("button");
    if (!btn) return;
    document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b === btn));
    show(btn.dataset.tab);
  });

  // '지금 새로고침': 월요일 8시를 기다리지 않고 세 가지 데이터를 바로 새로 받기
  refreshBtn.addEventListener("click", async () => {
    refreshBtn.disabled = true;
    refreshBtn.textContent = "받는 중...";
    try { await Promise.all(KEYS.map(refresh)); } catch (e) {}
    refreshBtn.disabled = false;
    refreshBtn.textContent = "지금 새로고침";
    show(current);
  });

  // 시작: 오래된 데이터만 골라서 동시에 요청 (이번 주에 이미 받았다면 요청 0번)
  KEYS.forEach(k => { if (isStale(load(k))) refresh(k).catch(() => {}); });
  show("drivers");
</script>
</body>
</html>
